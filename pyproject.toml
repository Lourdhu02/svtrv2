[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "svtrv2"
version = "1.0.0"
description = "SVTRv2 OCR engine for digital (seven-segment LCD/LED) utility meter displays"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Lourdhuraju" }]
keywords = ["ocr", "meter-reading", "svtrv2", "ctc", "seven-segment", "lcd", "scene-text-recognition"]
dependencies = [
    "torch>=2.0.0",
    "albumentations>=1.3.0",
    "opencv-python>=4.5.0",
    "numpy>=1.20.0",
    "tqdm>=4.60.0",
    "PyYAML>=5.4",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[project.scripts]
svtrv2 = "svtrv2.__main__:main"

[tool.setuptools.packages.find]
include = ["svtrv2*"]

[tool.ruff]
line-length = 110
