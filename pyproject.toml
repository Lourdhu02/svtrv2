[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "svtrv2"
version = "1.1.0"
description = "SVTRv2 research implementation for scene text recognition"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Lourdhuraju" }]
keywords = ["ocr", "svtrv2", "ctc", "scene-text-recognition", "paper-reproduction", "benchmarking"]
dependencies = [
    "torch>=2.0.0",
    "albumentations>=1.3.0",
    "opencv-python>=4.5.0",
    "numpy>=1.20.0",
    "tqdm>=4.60.0",
    "PyYAML>=5.4",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "lmdb>=0.9.0",            # LMDBTextDataset (Union14M-L training) + tools/
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "huggingface_hub>=0.20",  # re-download the benchmark pack into data/ if needed
]

[project.scripts]
svtrv2 = "svtrv2.__main__:main"

[tool.setuptools.packages.find]
include = ["svtrv2*"]

[tool.ruff]
line-length = 110
